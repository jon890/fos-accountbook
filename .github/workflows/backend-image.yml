name: Backend Image

on:
  push:
    branches:
      - main
    paths:
      - "backend/src/**"
      - "backend/build.gradle.kts"
      - "backend/settings.gradle.kts"
      - "backend/gradle/**"
      - "backend/Dockerfile"
      - ".github/workflows/backend-image.yml"
  # 수동 실행 지원
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (optional, defaults to SHA)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jon890/fos-accountbook-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 빌드가 멈춰도 기본 제한 6시간을 기다리지 않도록 짧게 끊는다
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main 브랜치 push 시 latest 태그
            type=raw,value=latest,enable={{is_default_branch}}
            # 커밋 SHA (짧은 버전)
            type=sha,prefix=,format=short
            # 수동 실행 시 입력한 태그
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            # 브랜치 이름
            type=ref,event=branch
            # 태그 (semver)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          # 홈 서버가 x86_64 라 amd64 만 만든다. arm64 는 QEMU 에뮬레이션이라 수십 분 걸리거나 멈췄다
          platforms: linux/amd64

      - name: Output image info
        run: |
          echo "## Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull command:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
